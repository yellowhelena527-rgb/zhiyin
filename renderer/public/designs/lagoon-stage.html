<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>声境 · 湖蓝舞台</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{--eazo-safe-area-top:max(56px,env(safe-area-inset-top,0px));--eazo-safe-area-bottom:max(34px,env(safe-area-inset-bottom,0px));--bg:#0A1620;--cyan:#35C9DE;--blue:#2B8FD9;--ink:#F4FBFC;--muted:#9DB5BC;--glass:rgba(16,35,45,.64);--line:rgba(188,240,246,.15);--r:24px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow-x:hidden}.app-shell{min-height:100svh;padding:var(--eazo-safe-area-top) max(20px,5vw) var(--eazo-safe-area-bottom);position:relative;isolation:isolate;overflow:hidden}.wall{position:absolute;inset:0;z-index:-3;background:url('https://cdn.eazo.ai/user-contents/design-variant-images/1bd4cedcc7d44b20b39c716e38a08cb4.png') center/cover}.veil{position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,rgba(5,14,19,.3),rgba(5,14,19,.08) 48%,rgba(5,14,19,.45));}.grain{position:absolute;inset:0;z-index:-1;opacity:.22;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E")}.layout{max-width:1440px;min-height:calc(100svh - var(--eazo-safe-area-top) - var(--eazo-safe-area-bottom));margin:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(310px,340px);align-items:center;gap:clamp(24px,7vw,132px)}.stage{align-self:stretch;min-width:0;display:flex;flex-direction:column;justify-content:space-between;padding:12px 0}.mark{font:500 11px/1 DM Mono,monospace;letter-spacing:.16em;color:#b9edf3;text-transform:uppercase}.stage h1{margin:0;max-width:650px;font:600 clamp(48px,7vw,104px)/.92 'Space Grotesk',sans-serif;letter-spacing:-.055em}.stage h1 i{font-style:normal;color:var(--cyan)}.sub{max-width:340px;margin:22px 0 0;color:#c3dce0;font-size:14px;line-height:1.65}.pulse-line{display:flex;align-items:center;gap:11px;color:#a8cbd2;font:11px DM Mono,monospace;letter-spacing:.08em}.pulse-line b{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 18px var(--cyan);animation:pulse 2.8s ease-in-out infinite}.panel{width:100%;padding:20px;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(135deg,rgba(51,105,124,.25),var(--glass));box-shadow:0 24px 80px rgba(0,0,0,.36),inset 0 1px rgba(255,255,255,.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.eyebrow{font:500 10px DM Mono,monospace;letter-spacing:.13em;color:var(--cyan)}.close{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer}.card{padding:18px 0 16px;border-top:1px solid var(--line)}.card:first-of-type{border-top:0;padding-top:0}.card h2{margin:6px 0;font:600 21px/1.15 'Space Grotesk',sans-serif;letter-spacing:-.04em}.card p{margin:0;color:#c5d9de;font-size:12px;line-height:1.62}.more{margin-top:10px;border:0;padding:0;background:none;color:var(--cyan);font:500 12px Inter;cursor:pointer}.wave{width:100%;height:76px;margin:13px 0 0}.wave path{stroke:var(--cyan);stroke-width:2;fill:none;filter:drop-shadow(0 0 5px rgba(53,201,222,.45))}.wave circle{fill:var(--bg);stroke:var(--cyan);stroke-width:2}.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;border-top:1px solid var(--line);padding-top:15px}.mode{min-height:44px;border:1px solid transparent;border-radius:14px;background:rgba(255,255,255,.045);color:#cbe3e7;font-size:16px;cursor:pointer;transition:.2s}.mode:hover{border-color:rgba(53,201,222,.45);background:rgba(53,201,222,.11)}.mode:active{transform:scale(.93)}.mode.active{background:linear-gradient(135deg,rgba(53,201,222,.28),rgba(43,143,217,.16));border-color:rgba(116,229,241,.52);box-shadow:0 0 20px rgba(53,201,222,.14)}.orb{position:fixed;right:max(26px,4vw);bottom:max(28px,4vw);width:62px;height:62px;border:1px solid rgba(197,251,255,.55);border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(224,255,255,.8),rgba(53,201,222,.43) 30%,rgba(11,60,85,.68) 68%);box-shadow:0 0 0 8px rgba(53,201,222,.06),0 0 46px rgba(53,201,222,.48);cursor:pointer;z-index:3;animation:orb 3.8s ease-in-out infinite}.orb:active{transform:scale(.88)}@keyframes orb{50%{box-shadow:0 0 0 15px rgba(53,201,222,.025),0 0 68px rgba(53,201,222,.67);filter:hue-rotate(10deg)}}@keyframes pulse{50%{transform:scale(.55);opacity:.5}}@media(max-width:720px){.app-shell{padding-left:20px;padding-right:20px}.layout{grid-template-columns:1fr;gap:25px;align-content:start}.stage{min-height:250px;padding-top:12px}.stage h1{font-size:52px}.panel{max-width:100%}.orb{width:56px;height:56px;right:22px;bottom:22px}.sub{font-size:13px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="app-shell"><div class="wall"></div><div class="veil"></div><div class="grain"></div><div class="layout"><div class="stage"><div><div class="mark">SONIC GUIDE / 03:27</div><h1>听见声音<br><i>正在发生。</i></h1><p class="sub">在每个转折处，留下一句恰到好处的音乐注脚。</p></div><div class="pulse-line"><b></b>LIVE LISTENING</div></div><div class="panel" aria-label="音乐导览面板"><div class="panel-head"><span class="eyebrow">NOW GUIDING</span><span class="close" role="button" tabindex="0" aria-label="关闭" onclick="console.log('close')">×</span></div><div class="card"><span class="eyebrow">03:27 · TECHNIQUE</span><h2>人声在这里退后半步</h2><p>低频留出空隙，鼓点把呼吸推向下一句。</p><span class="more" role="button" tabindex="0" onclick="console.log('more')">展开更多 ↗</span></div><div class="card"><span class="eyebrow">EMOTION MAP</span><svg class="wave" viewBox="0 0 280 76" preserveAspectRatio="none"><path d="M0 55 C32 54 38 18 72 31 S107 64 137 40 S180 8 206 29 S246 65 280 13"/><circle cx="72" cy="31" r="4"/><circle cx="137" cy="40" r="4"/><circle cx="206" cy="29" r="4"/></svg></div><div class="modes" aria-label="导览维度"><span class="mode active" role="button" tabindex="0" aria-label="人声" onclick="pick(this)">🎤</span><span class="mode" role="button" tabindex="0" aria-label="鼓点" onclick="pick(this)">🥁</span><span class="mode" role="button" tabindex="0" aria-label="吉他" onclick="pick(this)">🎸</span><span class="mode" role="button" tabindex="0" aria-label="氛围" onclick="pick(this)">🌫</span></div></div></div><button class="orb" aria-label="打开导览" onclick="console.log('orb clicked')"></button></main><script>function pick(el){document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));el.classList.add('active');console.log('dimension clicked')}</script></body></html>
